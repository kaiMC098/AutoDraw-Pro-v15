plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myautodraw'
    compileSdk 35

    defaultConfig {
        applicationId "com.myautodraw"
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName "19.0"
    }

    signingConfigs {
        release {
            def ks = file("myautodraw-release.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword "myautodraw_release_key"
                keyAlias "myautodraw"
                keyPassword "myautodraw_release_key"
            }
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
        debug {
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig file("myautodraw-release.jks").exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
