name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Chuẩn hóa vị trí thư mục dự án
        run: |
          if [ ! -f "settings.gradle" ] && [ -f "AutoDraw-Pro-fixed/settings.gradle" ]; then
            cp -rf AutoDraw-Pro-fixed/* .
            cp -rf AutoDraw-Pro-fixed/.gitignore . 2>/dev/null || true
          fi
          missing=0
          for f in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/myautodraw/MainActivity.java app/src/main/res/layout/activity_main.xml; do
            if [ ! -f "$f" ]; then echo "::error::Thiếu file $f"; missing=1; fi
          done
          exit $missing

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Thiết lập Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Biên dịch APK (debug)
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Tóm tắt nguyên nhân lỗi
        if: failure()
        run: |
          {
            echo '## Nguyên nhân lỗi build'
            echo '```'
            grep -n -E "What went wrong|error:|AAPT|Execution failed|Caused by|FAILURE" -A6 build.log | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyAutoDraw-Color-Pro.apk

      - name: Tải APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyAutoDraw-Color-Pro-APK
          path: MyAutoDraw-Color-Pro.apk
          if-no-files-found: error

      - name: Đăng APK lên mục Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" MyAutoDraw-Color-Pro.apk             --title "MyAutoDraw Color Pro - $TAG"             --notes "APK debug tự động build từ commit ${{ github.sha }}"
