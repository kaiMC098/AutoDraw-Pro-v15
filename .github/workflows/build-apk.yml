name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Tự động chuẩn hóa thư mục & sửa lỗi cú pháp trước khi build
        run: |
          python3 - << 'PY'
          import os, shutil, glob, re

          # 1. Nếu dự án nằm lồng trong thư mục con (ví dụ AutoDraw-Pro-fixed/), đưa toàn bộ ra gốc
          if not os.path.isfile("settings.gradle"):
              for root, dirs, files in os.walk("."):
                  if ".git" in root:
                      continue
                  if "settings.gradle" in files and root != ".":
                      print(f"Đưa dự án từ thư mục con {root} ra thư mục gốc...")
                      for item in os.listdir(root):
                          src = os.path.join(root, item)
                          dst = os.path.join(".", item)
                          if os.path.exists(dst):
                              if os.path.isdir(dst):
                                  shutil.rmtree(dst)
                              else:
                                  os.remove(dst)
                          shutil.move(src, dst)
                      break

          # 2. Tự động di chuyển các file tải nhầm lên thư mục gốc vào đúng vị trí chuẩn
          java_dest = "app/src/main/java/com/myautodraw"
          layout_dest = "app/src/main/res/layout"
          values_dest = "app/src/main/res/values"
          os.makedirs(java_dest, exist_ok=True)
          os.makedirs(layout_dest, exist_ok=True)
          os.makedirs(values_dest, exist_ok=True)

          for jf in glob.glob("*.java"):
              target_name = re.sub(r"(_v\d+|_HD|_safe|_\d+)(?=\.java$)", "", jf)
              shutil.move(jf, os.path.join(java_dest, target_name))
              print(f"Đã tự động chuyển {jf} -> {java_dest}/{target_name}")

          for xf in glob.glob("*.xml"):
              if xf == "AndroidManifest.xml":
                  shutil.move(xf, "app/src/main/AndroidManifest.xml")
              elif xf.startswith("strings"):
                  shutil.move(xf, os.path.join(values_dest, "strings.xml"))
              elif xf.startswith("colors"):
                  shutil.move(xf, os.path.join(values_dest, "colors.xml"))
              elif xf.startswith("themes"):
                  shutil.move(xf, os.path.join(values_dest, "themes.xml"))
              elif xf.startswith("activity_main"):
                  shutil.move(xf, os.path.join(layout_dest, "activity_main.xml"))
              elif xf.startswith("overlay_panel"):
                  shutil.move(xf, os.path.join(layout_dest, "overlay_panel.xml"))

          for gf in ["app_build.gradle.txt", "app_build.gradle", "app_build_v35.gradle"]:
              if os.path.isfile(gf):
                  shutil.move(gf, "app/build.gradle")

          # 3. Tự động sửa lỗi chuỗi văn bản bị ngắt xuống dòng thật trong mọi file .java
          for jf in glob.glob(f"{java_dest}/*.java"):
              with open(jf, "r", encoding="utf-8", errors="replace") as f:
                  lines = f.read().splitlines()
              fixed_lines = []
              in_str = False
              buf = ""
              for line in lines:
                  buf = line if not in_str else (buf + "\\u000A" + line)
                  cleaned = buf.replace('\\"', '')
                  if cleaned.count('"') % 2 == 0:
                      fixed_lines.append(buf)
                      buf = ""
                      in_str = False
                  else:
                      in_str = True
              if buf:
                  fixed_lines.append(buf)
              with open(jf, "w", encoding="utf-8") as f:
                  f.write("\n".join(fixed_lines) + "\n")

          # 4. Đảm bảo root build.gradle & app/build.gradle luôn tương thích compileSdk 35
          if os.path.isfile("build.gradle"):
              with open("build.gradle", "r", encoding="utf-8") as f:
                  bg = f.read()
              bg = re.sub(r'version\s+["\']8\.[0-6]\.\d+["\']', 'version "8.7.2"', bg)
              with open("build.gradle", "w", encoding="utf-8") as f:
                  f.write(bg)

          if os.path.isfile("app/build.gradle"):
              with open("app/build.gradle", "r", encoding="utf-8") as f:
                  abg = f.read()
              abg = re.sub(r'compileSdk\s+3[0-4]', 'compileSdk 35', abg)
              if "abortOnError" not in abg:
                  abg = abg.replace("compileOptions {", "lint { abortOnError false }\n    compileOptions {")
              with open("app/build.gradle", "w", encoding="utf-8") as f:
                  f.write(abg)
          PY

          missing=0
          for f in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/myautodraw/MainActivity.java app/src/main/res/layout/activity_main.xml; do
            if [ ! -f "$f" ]; then echo "::error::Thiếu file $f"; missing=1; fi
          done
          exit $missing

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Thiết lập Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tạo khóa ký chuẩn v1+v2+v3 (tương thích Android 7–15)
        run: |
          if [ ! -f app/myautodraw-release.jks ]; then
            keytool -genkeypair -v -keystore app/myautodraw-release.jks \
              -alias myautodraw -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass myautodraw_release_key -keypass myautodraw_release_key \
              -dname "CN=MyAutoDraw Pro, OU=OpenSource, O=ellenjoe023, L=VN, S=VN, C=VN"
          fi

      - name: Biên dịch APK (Release ký v1+v2+v3)
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Tóm tắt nguyên nhân lỗi
        if: failure()
        run: |
          {
            echo '## Nguyên nhân lỗi build'
            echo '```'
            grep -n -E "\.java:[0-9]+:|What went wrong|error:|AAPT|Execution failed|FAILURE" -A4 build.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk MyAutoDraw-Pro-v19.apk

      - name: Tải APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyAutoDraw-Pro-v19-APK
          path: MyAutoDraw-Pro-v19.apk
          if-no-files-found: error

      - name: Đăng APK lên mục Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v19-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" MyAutoDraw-Pro-v19.apk \
            --title "MyAutoDraw Pro v19 Supreme (@ellenjoe023) - $TAG" \
            --notes "APK v19 Supreme (ký chuẩn v1+v2+v3) tự động build từ commit ${{ github.sha }}"
